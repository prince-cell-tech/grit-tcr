[package]
name = "grit-tcr"
version = "0.9.0"
edition = "2021"
authors = ["Prince Riwa"]
description = "test && commit || revert — in your terminal or as a TUI task manager"
license = "MIT"
repository = "https://github.com/prince-cell-tech/grit-tcr"
readme = "README.md"
keywords = ["tcr", "tdd", "tui", "git", "task"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "grit-tcr"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
